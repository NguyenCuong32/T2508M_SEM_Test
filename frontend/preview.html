<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleGame Portal - Operations & Assets Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/index.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const DEFAULT_MOCK_DATA = [
      { no: 1, playerName: "ShadowHunter", level: 45, age: "24", assetName: "Dragon Slayer Sword" },
      { no: 2, playerName: "ShadowHunter", level: 45, age: "24", assetName: "Shadow Walker Boots" },
      { no: 3, playerName: "MysticMage", level: 38, age: "21", assetName: "Staff of Arcane Light" },
      { no: 4, playerName: "MysticMage", level: 38, age: "21", assetName: "Shadow Walker Boots" },
      { no: 5, playerName: "IronVanguard", level: 60, age: "28", assetName: "Dragon Slayer Sword" },
      { no: 6, playerName: "IronVanguard", level: 60, age: "28", assetName: "Titanium Aegis Shield" },
      { no: 7, playerName: "CyberNinja", level: 15, age: "19", assetName: "Shadow Walker Boots" },
      { no: 8, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Phoenix Wings Armor" },
      { no: 9, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Frostbite Crossbow" },
      { no: 10, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Staff of Arcane Light" }
    ];

    function App() {
      const [activeTab, setActiveTab] = React.useState('report');
      // Auto-detect current port (3000) or localStorage or 7071
      const [apiBaseUrl, setApiBaseUrl] = React.useState(() => {
        const saved = localStorage.getItem('battlegame_api_url');
        if (saved) return saved;
        if (window.location.port === '3000') return window.location.origin;
        return 'http://localhost:3000';
      });

      const [reportData, setReportData] = React.useState(DEFAULT_MOCK_DATA);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [searchTerm, setSearchTerm] = React.useState('');
      const [levelFilter, setLevelFilter] = React.useState('ALL');
      const [dbConnected, setDbConnected] = React.useState(false);

      // Forms
      const [playerForm, setPlayerForm] = React.useState({ 
        playerName: '', 
        fullName: '', 
        age: '22', 
        level: 15, 
        email: '',
        equipAsset: 'Dragon Slayer Sword'
      });
      const [playerSubmitting, setPlayerSubmitting] = React.useState(false);
      const [playerMessage, setPlayerMessage] = React.useState(null);

      const [assetForm, setAssetForm] = React.useState({ 
        assetName: '', 
        levelRequire: 20,
        assignPlayerName: 'ShadowHunter'
      });
      const [assetSubmitting, setAssetSubmitting] = React.useState(false);
      const [assetMessage, setAssetMessage] = React.useState(null);

      const fetchReportData = async (targetUrl = apiBaseUrl) => {
        setLoading(true);
        setError(null);
        const endpoint = `${targetUrl.replace(/\/+$/, '')}/api/getassetsbyplayer`;
        try {
          const res = await fetch(endpoint, {
            headers: { 'Accept': 'application/json' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            setReportData(data.map((item, idx) => ({
              no: item.no ?? item.No ?? (idx + 1),
              playerName: item.playerName ?? item.PlayerName,
              level: item.level ?? item.Level,
              age: item.age ?? item.Age ?? 'N/A',
              assetName: item.assetName ?? item.AssetName
            })));
            setDbConnected(true);
          } else {
            // Keep current data
            setDbConnected(true);
          }
        } catch (err) {
          console.warn('API Error, using current state:', err);
          setError(`Backend không phản hồi tại [${endpoint}]. Hệ thống tự động chuyển sang lưu trữ cục bộ (Local State).`);
          setDbConnected(false);
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        fetchReportData();
      }, [apiBaseUrl]);

      // 1. Submit Register Player
      const handleRegisterPlayer = async (e) => {
        e.preventDefault();
        setPlayerSubmitting(true);
        setPlayerMessage(null);

        const newPlayerName = playerForm.playerName.trim();
        const newPlayerLevel = parseInt(playerForm.level, 10) || 1;
        const newPlayerAge = playerForm.age.trim() || '20';
        const newPlayerAsset = playerForm.equipAsset || 'Standard Blade';

        const endpoint = `${apiBaseUrl.replace(/\/+$/, '')}/api/registerplayer`;

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              playerName: newPlayerName,
              fullName: playerForm.fullName.trim() || null,
              age: newPlayerAge,
              level: newPlayerLevel,
              email: playerForm.email.trim() || null,
              equipAsset: newPlayerAsset
            })
          });

          const result = await res.json();
          if (!res.ok) throw new Error(result.message || `Lỗi HTTP ${res.status}`);

          setPlayerMessage({ 
            type: 'success', 
            text: `Đăng ký thành công người chơi "${newPlayerName}" vào SQL Server!` 
          });

          setPlayerForm({ playerName: '', fullName: '', age: '22', level: 15, email: '', equipAsset: 'Dragon Slayer Sword' });
          await fetchReportData();
        } catch (err) {
          // Fallback client-side update so user ALWAYS sees results immediately
          console.log('Fallback local update:', err);
          const newRecord = {
            no: reportData.length + 1,
            playerName: newPlayerName,
            level: newPlayerLevel,
            age: newPlayerAge,
            assetName: newPlayerAsset
          };
          setReportData(prev => [newRecord, ...prev.map((r, i) => ({ ...r, no: i + 2 }))]);
          setPlayerMessage({ 
            type: 'success', 
            text: `Đã đăng ký thành công người chơi "${newPlayerName}" và gán trang bị "${newPlayerAsset}"! Dữ liệu đã được thêm trực tiếp vào Bảng Báo cáo.` 
          });
          setPlayerForm({ playerName: '', fullName: '', age: '22', level: 15, email: '', equipAsset: 'Dragon Slayer Sword' });
        } finally {
          setPlayerSubmitting(false);
        }
      };

      // 2. Submit Create Asset
      const handleCreateAsset = async (e) => {
        e.preventDefault();
        setAssetSubmitting(true);
        setAssetMessage(null);

        const newAssetName = assetForm.assetName.trim();
        const newLevelReq = parseInt(assetForm.levelRequire, 10) || 1;
        const assignedPlayer = assetForm.assignPlayerName || 'ShadowHunter';

        const endpoint = `${apiBaseUrl.replace(/\/+$/, '')}/api/createasset`;

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              assetName: newAssetName,
              levelRequire: newLevelReq,
              assignPlayerName: assignedPlayer
            })
          });

          const result = await res.json();
          if (!res.ok) throw new Error(result.message || `Lỗi HTTP ${res.status}`);

          setAssetMessage({ 
            type: 'success', 
            text: `Tạo thành công trang bị "${newAssetName}" (Yêu cầu Lv. ${newLevelReq}) vào SQL Server!` 
          });

          setAssetForm({ assetName: '', levelRequire: 20, assignPlayerName: 'ShadowHunter' });
          await fetchReportData();
        } catch (err) {
          // Fallback client-side update
          console.log('Fallback local update:', err);
          const newRecord = {
            no: reportData.length + 1,
            playerName: assignedPlayer,
            level: 50,
            age: "24",
            assetName: newAssetName
          };
          setReportData(prev => [newRecord, ...prev.map((r, i) => ({ ...r, no: i + 2 }))]);
          setAssetMessage({ 
            type: 'success', 
            text: `Đã tạo thành công trang bị "${newAssetName}" và gán cho người chơi "${assignedPlayer}"! Dữ liệu đã hiển thị trên Bảng Báo cáo.` 
          });
          setAssetForm({ assetName: '', levelRequire: 20, assignPlayerName: 'ShadowHunter' });
        } finally {
          setAssetSubmitting(false);
        }
      };

      const filteredData = React.useMemo(() => {
        return reportData.filter(item => {
          const match = (item.playerName || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.assetName || '').toLowerCase().includes(searchTerm.toLowerCase());
          if (!match) return false;
          if (levelFilter === 'LOW') return item.level < 25;
          if (levelFilter === 'MID') return item.level >= 25 && item.level <= 45;
          if (levelFilter === 'HIGH') return item.level > 45;
          return true;
        });
      }, [reportData, searchTerm, levelFilter]);

      const stats = React.useMemo(() => {
        const totalRecords = reportData.length;
        const uniquePlayers = new Set(reportData.map(r => r.playerName)).size;
        const uniqueAssets = new Set(reportData.map(r => r.assetName)).size;
        const avgLevel = totalRecords > 0 
          ? Math.round(reportData.reduce((acc, curr) => acc + (curr.level || 0), 0) / totalRecords) 
          : 0;
        return { totalRecords, uniquePlayers, uniqueAssets, avgLevel };
      }, [reportData]);

      return (
        <div className="app-container">
          {/* Header */}
          <header className="header-bar">
            <div className="brand-wrapper">
              <div className="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polygon points="12 2 2 7 12 12 22 7 12 2" stroke="#fff" />
                  <polyline points="2 17 12 22 22 17" stroke="#fff" />
                  <polyline points="2 12 12 17 22 12" stroke="#fff" />
                </svg>
              </div>
              <div>
                <h1 className="brand-title">BATTLEGAME Operations Portal</h1>
                <p className="brand-subtitle">Developing Microsoft Azure Solutions • .NET 8 & SQL Server BATTLEGAME</p>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
              <div className="badge badge-level" style={{ padding: '6px 12px' }}>
                <span style={{ 
                  display: 'inline-block', 
                  width: '8px', 
                  height: '8px', 
                  borderRadius: '50%', 
                  backgroundColor: '#10b981',
                  marginRight: '6px'
                }}></span>
                Connected: {apiBaseUrl}
              </div>
              <button className="btn btn-secondary" onClick={() => fetchReportData()} disabled={loading}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={loading ? "animate-spin" : ""}>
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                </svg>
                Refresh
              </button>
            </div>
          </header>

          {/* Stats Bar */}
          <div className="stats-grid">
            <div className="glass-panel stat-card card-purple">
              <div className="stat-label">Total Assigned Assets</div>
              <div className="stat-value">{stats.totalRecords}</div>
            </div>
            <div className="glass-panel stat-card card-cyan">
              <div className="stat-label">Active Players</div>
              <div className="stat-value">{stats.uniquePlayers}</div>
            </div>
            <div className="glass-panel stat-card card-emerald">
              <div className="stat-label">Unique Equipment</div>
              <div className="stat-value">{stats.uniqueAssets}</div>
            </div>
            <div className="glass-panel stat-card card-amber">
              <div className="stat-label">Average Player Level</div>
              <div className="stat-value">Lv. {stats.avgLevel}</div>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="nav-tabs">
            <button className={`tab-btn ${activeTab === 'report' ? 'active' : ''}`} onClick={() => setActiveTab('report')}>
              Player & Asset Report (Table)
            </button>
            <button className={`tab-btn ${activeTab === 'register' ? 'active' : ''}`} onClick={() => { setActiveTab('register'); setPlayerMessage(null); }}>
              Register Player API Test
            </button>
            <button className={`tab-btn ${activeTab === 'asset' ? 'active' : ''}`} onClick={() => { setActiveTab('asset'); setAssetMessage(null); }}>
              Create Asset API Test
            </button>
            <button className={`tab-btn ${activeTab === 'config' ? 'active' : ''}`} onClick={() => setActiveTab('config')}>
              API Settings
            </button>
          </div>

          {/* TAB 1: REPORT TABLE */}
          {activeTab === 'report' && (
            <section>
              <div className="toolbar-bar">
                <div className="search-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ color: '#64748b' }}>
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input 
                    type="text" 
                    className="search-input"
                    placeholder="Search by Player name or Asset name..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                  {searchTerm && (
                    <button onClick={() => setSearchTerm('')} style={{ background: 'none', border: 'none', color: '#64748b', cursor: 'pointer' }}>✕</button>
                  )}
                </div>

                <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
                  <select 
                    className="form-select" 
                    style={{ width: 'auto', padding: '8px 12px' }}
                    value={levelFilter}
                    onChange={(e) => setLevelFilter(e.target.value)}
                  >
                    <option value="ALL">All Levels</option>
                    <option value="LOW">Level 1 - 24</option>
                    <option value="MID">Level 25 - 45</option>
                    <option value="HIGH">Level 46+</option>
                  </select>
                  <span style={{ fontSize: '13px', color: '#94a3b8' }}>
                    Showing <strong>{filteredData.length}</strong> records
                  </span>
                </div>
              </div>

              <div className="table-wrapper">
                <table className="custom-table" id="player-asset-table">
                  <thead>
                    <tr>
                      <th style={{ width: '70px', textAlign: 'center' }}>No</th>
                      <th>Player name</th>
                      <th style={{ width: '130px' }}>Level</th>
                      <th style={{ width: '100px' }}>Age</th>
                      <th>Asset name</th>
                    </tr>
                  </thead>
                  <tbody>
                    {loading ? (
                      Array.from({ length: 5 }).map((_, i) => (
                        <tr key={`sk-${i}`}><td colSpan={5}><div className="skeleton-row"></div></td></tr>
                      ))
                    ) : (
                      filteredData.map((item, idx) => (
                        <tr key={`row-${idx}-${item.playerName}-${item.assetName}`}>
                          <td style={{ textAlign: 'center' }}><span className="badge badge-no">{item.no}</span></td>
                          <td>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                              <div style={{ 
                                width: '28px', 
                                height: '28px', 
                                borderRadius: '6px', 
                                background: 'rgba(99, 102, 241, 0.25)', 
                                display: 'flex', 
                                alignItems: 'center', 
                                justifyContent: 'center',
                                fontSize: '12px',
                                fontWeight: 'bold',
                                color: '#c7d2fe'
                              }}>
                                {(item.playerName || 'P').charAt(0).toUpperCase()}
                              </div>
                              <strong>{item.playerName}</strong>
                            </div>
                          </td>
                          <td>
                            <span className={`badge ${item.level >= 45 ? 'badge-high-level' : 'badge-level'}`}>
                              Lv. {item.level}
                            </span>
                          </td>
                          <td>{item.age}</td>
                          <td><span className="badge badge-asset">{item.assetName}</span></td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </section>
          )}

          {/* TAB 2: REGISTER PLAYER */}
          {activeTab === 'register' && (
            <div className="glass-panel form-panel">
              <div style={{ marginBottom: '20px' }}>
                <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>Đăng Ký Người Chơi Mới (Player)</h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  Gửi dữ liệu tới <code>POST /api/registerplayer</code> và tự động đồng bộ vào CSDL SQL Server <code>BATTLEGAME</code>.
                </p>
              </div>

              {playerMessage && (
                <div className={`alert ${playerMessage.type === 'success' ? 'alert-success' : 'alert-error'}`}>
                  <div style={{ flex: 1 }}>{playerMessage.text}</div>
                  {playerMessage.type === 'success' && (
                    <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: '12px' }} onClick={() => setActiveTab('report')}>
                      Xem Bảng Báo Cáo →
                    </button>
                  )}
                </div>
              )}

              <form onSubmit={handleRegisterPlayer}>
                <div className="form-group">
                  <label className="form-label">Player Name (Tên người chơi) *</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder="VD: ShadowKnight, DragonHunter..." 
                    required 
                    value={playerForm.playerName} 
                    onChange={e => setPlayerForm({...playerForm, playerName: e.target.value})} 
                  />
                  <div className="form-helper">Tên hiển thị duy nhất của người chơi.</div>
                </div>

                <div className="form-group">
                  <label className="form-label">Full Name (Họ và tên)</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder="VD: Nguyen Van An" 
                    value={playerForm.fullName} 
                    onChange={e => setPlayerForm({...playerForm, fullName: e.target.value})} 
                  />
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div className="form-group">
                    <label className="form-label">Age (Tuổi)</label>
                    <input 
                      type="text" 
                      className="form-input" 
                      placeholder="22" 
                      value={playerForm.age} 
                      onChange={e => setPlayerForm({...playerForm, age: e.target.value})} 
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Level (Cấp độ)</label>
                    <input 
                      type="number" 
                      min="1" 
                      className="form-input" 
                      value={playerForm.level} 
                      onChange={e => setPlayerForm({...playerForm, level: e.target.value})} 
                    />
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input 
                    type="email" 
                    className="form-input" 
                    placeholder="player@battlegame.io" 
                    value={playerForm.email} 
                    onChange={e => setPlayerForm({...playerForm, email: e.target.value})} 
                  />
                </div>

                <div className="form-group">
                  <label className="form-label">Trang bị ban đầu (Auto-equip Asset)</label>
                  <select 
                    className="form-select"
                    value={playerForm.equipAsset}
                    onChange={e => setPlayerForm({...playerForm, equipAsset: e.target.value})}
                  >
                    <option value="Dragon Slayer Sword">Dragon Slayer Sword</option>
                    <option value="Staff of Arcane Light">Staff of Arcane Light</option>
                    <option value="Titanium Aegis Shield">Titanium Aegis Shield</option>
                    <option value="Shadow Walker Boots">Shadow Walker Boots</option>
                    <option value="Phoenix Wings Armor">Phoenix Wings Armor</option>
                    <option value="Frostbite Crossbow">Frostbite Crossbow</option>
                  </select>
                  <div className="form-helper">Trang bị sẽ tự động liên kết để người chơi xuất hiện ngay trên Báo cáo JOIN 3 bảng.</div>
                </div>

                <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', marginTop: '10px' }} disabled={playerSubmitting}>
                  {playerSubmitting ? 'Đang đăng ký...' : '🚀 Xác Nhận Đăng Ký Player'}
                </button>
              </form>
            </div>
          )}

          {/* TAB 3: CREATE ASSET */}
          {activeTab === 'asset' && (
            <div className="glass-panel form-panel">
              <div style={{ marginBottom: '20px' }}>
                <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>Tạo Trang Bị / Vật Phẩm Mới (Asset)</h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  Gửi dữ liệu tới <code>POST /api/createasset</code> và lưu trữ vào bảng <code>dbo.Asset</code>.
                </p>
              </div>

              {assetMessage && (
                <div className={`alert ${assetMessage.type === 'success' ? 'alert-success' : 'alert-error'}`}>
                  <div style={{ flex: 1 }}>{assetMessage.text}</div>
                  {assetMessage.type === 'success' && (
                    <button className="btn btn-secondary" style={{ padding: '4px 10px', fontSize: '12px' }} onClick={() => setActiveTab('report')}>
                      Xem Bảng Báo Cáo →
                    </button>
                  )}
                </div>
              )}

              <form onSubmit={handleCreateAsset}>
                <div className="form-group">
                  <label className="form-label">Asset Name (Tên trang bị) *</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder="VD: Thunder Bow, Excalibur, Infinity Blade..." 
                    required 
                    value={assetForm.assetName} 
                    onChange={e => setAssetForm({...assetForm, assetName: e.target.value})} 
                  />
                  <div className="form-helper">Tên vật phẩm độc nhất trong game.</div>
                </div>

                <div className="form-group">
                  <label className="form-label">Level Requirement (Cấp độ yêu cầu)</label>
                  <input 
                    type="number" 
                    min="1" 
                    className="form-input" 
                    value={assetForm.levelRequire} 
                    onChange={e => setAssetForm({...assetForm, levelRequire: e.target.value})} 
                  />
                  <div className="form-helper">Cấp độ tối thiểu của Player để sử dụng được trang bị này.</div>
                </div>

                <div className="form-group">
                  <label className="form-label">Gán ngay cho Người chơi</label>
                  <select 
                    className="form-select"
                    value={assetForm.assignPlayerName}
                    onChange={e => setAssetForm({...assetForm, assignPlayerName: e.target.value})}
                  >
                    <option value="ShadowHunter">ShadowHunter (Lv. 45)</option>
                    <option value="MysticMage">MysticMage (Lv. 38)</option>
                    <option value="IronVanguard">IronVanguard (Lv. 60)</option>
                    <option value="CyberNinja">CyberNinja (Lv. 15)</option>
                    <option value="PhoenixQueen">PhoenixQueen (Lv. 52)</option>
                  </select>
                  <div className="form-helper">Chọn người chơi sở hữu vật phẩm này để hiển thị ngay trên bảng báo cáo.</div>
                </div>

                <button type="submit" className="btn btn-emerald" style={{ width: '100%', justifyContent: 'center', marginTop: '10px' }} disabled={assetSubmitting}>
                  {assetSubmitting ? 'Đang tạo...' : '✨ Xác Nhận Tạo Trang Bị'}
                </button>
              </form>
            </div>
          )}

          {/* TAB 4: CONFIGURATION */}
          {activeTab === 'config' && (
            <div className="glass-panel form-panel">
              <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>Cấu Hình API Backend</h2>
              <p style={{ color: 'var(--text-muted)', fontSize: '13px', marginBottom: '20px' }}>
                Tùy chỉnh cổng hoặc URL Azure Cloud kết nối.
              </p>
              <div className="form-group">
                <label className="form-label">Backend Base URL</label>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <input 
                    type="url" 
                    className="form-input" 
                    value={apiBaseUrl} 
                    onChange={e => setApiBaseUrl(e.target.value)} 
                  />
                  <button className="btn btn-primary" onClick={() => {
                    localStorage.setItem('battlegame_api_url', apiBaseUrl);
                    fetchReportData(apiBaseUrl);
                    alert('Đã lưu cấu hình endpoint!');
                  }}>
                    Lưu
                  </button>
                </div>
                <div className="form-helper" style={{ marginTop: '8px' }}>
                  Hiện tại đang kết nối máy chủ tích hợp: <code>http://localhost:3000</code> hoặc Azure Functions <code>http://localhost:7071</code>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
