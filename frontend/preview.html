<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleGame Portal - Standalone HTML Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/index.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const DEFAULT_MOCK_DATA = [
      { no: 1, playerName: "ShadowHunter", level: 45, age: "24", assetName: "Dragon Slayer Sword" },
      { no: 2, playerName: "ShadowHunter", level: 45, age: "24", assetName: "Shadow Walker Boots" },
      { no: 3, playerName: "MysticMage", level: 38, age: "21", assetName: "Staff of Arcane Light" },
      { no: 4, playerName: "MysticMage", level: 38, age: "21", assetName: "Shadow Walker Boots" },
      { no: 5, playerName: "IronVanguard", level: 60, age: "28", assetName: "Dragon Slayer Sword" },
      { no: 6, playerName: "IronVanguard", level: 60, age: "28", assetName: "Titanium Aegis Shield" },
      { no: 7, playerName: "CyberNinja", level: 15, age: "19", assetName: "Shadow Walker Boots" },
      { no: 8, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Phoenix Wings Armor" },
      { no: 9, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Frostbite Crossbow" },
      { no: 10, playerName: "PhoenixQueen", level: 52, age: "26", assetName: "Staff of Arcane Light" }
    ];

    function App() {
      const [activeTab, setActiveTab] = React.useState('report');
      const [apiBaseUrl, setApiBaseUrl] = React.useState('http://localhost:7071');
      const [reportData, setReportData] = React.useState(DEFAULT_MOCK_DATA);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [searchTerm, setSearchTerm] = React.useState('');
      const [levelFilter, setLevelFilter] = React.useState('ALL');
      const [usingMock, setUsingMock] = React.useState(true);

      const [playerForm, setPlayerForm] = React.useState({ playerName: '', fullName: '', age: '', level: 1, email: '' });
      const [playerSubmitting, setPlayerSubmitting] = React.useState(false);
      const [playerMessage, setPlayerMessage] = React.useState(null);

      const [assetForm, setAssetForm] = React.useState({ assetName: '', levelRequire: 1 });
      const [assetSubmitting, setAssetSubmitting] = React.useState(false);
      const [assetMessage, setAssetMessage] = React.useState(null);

      const fetchReportData = async () => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`${apiBaseUrl.replace(/\/+$/, '')}/api/getassetsbyplayer`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setReportData(data.map((item, idx) => ({
            no: item.no ?? item.No ?? (idx + 1),
            playerName: item.playerName ?? item.PlayerName,
            level: item.level ?? item.Level,
            age: item.age ?? item.Age ?? 'N/A',
            assetName: item.assetName ?? item.AssetName
          })));
          setUsingMock(false);
        } catch (err) {
          setError(`Cannot connect to Backend API at [${apiBaseUrl}/api/getassetsbyplayer]. Using mock preview data.`);
          setReportData(DEFAULT_MOCK_DATA);
          setUsingMock(true);
        } finally {
          setLoading(false);
        }
      };

      const handleRegisterPlayer = async (e) => {
        e.preventDefault();
        setPlayerSubmitting(true);
        setPlayerMessage(null);
        try {
          const res = await fetch(`${apiBaseUrl.replace(/\/+$/, '')}/api/registerplayer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              playerName: playerForm.playerName,
              fullName: playerForm.fullName || null,
              age: playerForm.age || null,
              level: parseInt(playerForm.level, 10) || 1,
              email: playerForm.email || null
            })
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || `HTTP ${res.status}`);
          setPlayerMessage({ type: 'success', text: `Player ${playerForm.playerName} registered successfully!` });
          setPlayerForm({ playerName: '', fullName: '', age: '', level: 1, email: '' });
          fetchReportData();
        } catch (err) {
          setPlayerMessage({ type: 'error', text: `Failed: ${err.message}` });
        } finally {
          setPlayerSubmitting(false);
        }
      };

      const handleCreateAsset = async (e) => {
        e.preventDefault();
        setAssetSubmitting(true);
        setAssetMessage(null);
        try {
          const res = await fetch(`${apiBaseUrl.replace(/\/+$/, '')}/api/createasset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              assetName: assetForm.assetName,
              levelRequire: parseInt(assetForm.levelRequire, 10) || 1
            })
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.message || `HTTP ${res.status}`);
          setAssetMessage({ type: 'success', text: `Asset ${assetForm.assetName} created successfully!` });
          setAssetForm({ assetName: '', levelRequire: 1 });
        } catch (err) {
          setAssetMessage({ type: 'error', text: `Failed: ${err.message}` });
        } finally {
          setAssetSubmitting(false);
        }
      };

      const filteredData = React.useMemo(() => {
        return reportData.filter(item => {
          const match = item.playerName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.assetName.toLowerCase().includes(searchTerm.toLowerCase());
          if (!match) return false;
          if (levelFilter === 'LOW') return item.level < 25;
          if (levelFilter === 'MID') return item.level >= 25 && item.level <= 45;
          if (levelFilter === 'HIGH') return item.level > 45;
          return true;
        });
      }, [reportData, searchTerm, levelFilter]);

      const stats = React.useMemo(() => {
        const totalRecords = reportData.length;
        const uniquePlayers = new Set(reportData.map(r => r.playerName)).size;
        const uniqueAssets = new Set(reportData.map(r => r.assetName)).size;
        const avgLevel = totalRecords > 0 
          ? Math.round(reportData.reduce((acc, curr) => acc + (curr.level || 0), 0) / totalRecords) 
          : 0;
        return { totalRecords, uniquePlayers, uniqueAssets, avgLevel };
      }, [reportData]);

      return (
        <div className="app-container">
          <header className="header-bar">
            <div className="brand-wrapper">
              <div className="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polygon points="12 2 2 7 12 12 22 7 12 2" stroke="#fff" />
                  <polyline points="2 17 12 22 22 17" stroke="#fff" />
                  <polyline points="2 12 12 17 22 12" stroke="#fff" />
                </svg>
              </div>
              <div>
                <h1 className="brand-title">BATTLEGAME Operations Portal</h1>
                <p className="brand-subtitle">Microsoft Azure Solutions • Azure Functions (.NET 8 Isolated) & SQL Server</p>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
              <div className={`badge ${usingMock ? 'badge-asset' : 'badge-level'}`} style={{ padding: '6px 12px' }}>
                <span style={{ 
                  display: 'inline-block', 
                  width: '8px', 
                  height: '8px', 
                  borderRadius: '50%', 
                  backgroundColor: usingMock ? '#f59e0b' : '#10b981',
                  marginRight: '6px'
                }}></span>
                {usingMock ? 'Mock Preview Active' : 'Azure Function Live'}
              </div>
              <button className="btn btn-secondary" onClick={fetchReportData} disabled={loading}>
                Refresh
              </button>
            </div>
          </header>

          <div className="stats-grid">
            <div className="glass-panel stat-card card-purple">
              <div className="stat-label">Total Assigned Assets</div>
              <div className="stat-value">{stats.totalRecords}</div>
            </div>
            <div className="glass-panel stat-card card-cyan">
              <div className="stat-label">Active Players</div>
              <div className="stat-value">{stats.uniquePlayers}</div>
            </div>
            <div className="glass-panel stat-card card-emerald">
              <div className="stat-label">Unique Equipment</div>
              <div className="stat-value">{stats.uniqueAssets}</div>
            </div>
            <div className="glass-panel stat-card card-amber">
              <div className="stat-label">Average Player Level</div>
              <div className="stat-value">Lv. {stats.avgLevel}</div>
            </div>
          </div>

          <div className="nav-tabs">
            <button className={`tab-btn ${activeTab === 'report' ? 'active' : ''}`} onClick={() => setActiveTab('report')}>
              Player & Asset Report (Table)
            </button>
            <button className={`tab-btn ${activeTab === 'register' ? 'active' : ''}`} onClick={() => setActiveTab('register')}>
              Register Player API Test
            </button>
            <button className={`tab-btn ${activeTab === 'asset' ? 'active' : ''}`} onClick={() => setActiveTab('asset')}>
              Create Asset API Test
            </button>
            <button className={`tab-btn ${activeTab === 'config' ? 'active' : ''}`} onClick={() => setActiveTab('config')}>
              API Settings
            </button>
          </div>

          {activeTab === 'report' && (
            <section>
              {error && (
                <div className="alert alert-error">
                  <div><strong>Notice:</strong> {error}</div>
                </div>
              )}

              <div className="toolbar-bar">
                <div className="search-box">
                  <input 
                    type="text" 
                    className="search-input"
                    placeholder="Search by Player name or Asset name..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                </div>

                <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
                  <select 
                    className="form-select" 
                    style={{ width: 'auto', padding: '8px 12px' }}
                    value={levelFilter}
                    onChange={(e) => setLevelFilter(e.target.value)}
                  >
                    <option value="ALL">All Levels</option>
                    <option value="LOW">Level 1 - 24</option>
                    <option value="MID">Level 25 - 45</option>
                    <option value="HIGH">Level 46+</option>
                  </select>
                  <span style={{ fontSize: '13px', color: '#94a3b8' }}>
                    Showing <strong>{filteredData.length}</strong> records
                  </span>
                </div>
              </div>

              <div className="table-wrapper">
                <table className="custom-table">
                  <thead>
                    <tr>
                      <th style={{ width: '70px', textAlign: 'center' }}>No</th>
                      <th>Player name</th>
                      <th style={{ width: '130px' }}>Level</th>
                      <th style={{ width: '100px' }}>Age</th>
                      <th>Asset name</th>
                    </tr>
                  </thead>
                  <tbody>
                    {loading ? (
                      Array.from({ length: 5 }).map((_, i) => (
                        <tr key={`sk-${i}`}><td colSpan={5}><div className="skeleton-row"></div></td></tr>
                      ))
                    ) : (
                      filteredData.map((item) => (
                        <tr key={`${item.no}-${item.playerName}-${item.assetName}`}>
                          <td style={{ textAlign: 'center' }}><span className="badge badge-no">{item.no}</span></td>
                          <td><strong>{item.playerName}</strong></td>
                          <td><span className={`badge ${item.level >= 45 ? 'badge-high-level' : 'badge-level'}`}>Lv. {item.level}</span></td>
                          <td>{item.age}</td>
                          <td><span className="badge badge-asset">{item.assetName}</span></td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </section>
          )}

          {activeTab === 'register' && (
            <div className="glass-panel form-panel">
              <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>Register New Player</h2>
              <p style={{ color: 'var(--text-muted)', fontSize: '13px', marginBottom: '20px' }}>
                Calls <code>POST /api/registerplayer</code> to save into SQL Server.
              </p>
              {playerMessage && (
                <div className={`alert ${playerMessage.type === 'success' ? 'alert-success' : 'alert-error'}`}>
                  {playerMessage.text}
                </div>
              )}
              <form onSubmit={handleRegisterPlayer}>
                <div className="form-group">
                  <label className="form-label">Player Name *</label>
                  <input type="text" className="form-input" required value={playerForm.playerName} onChange={e => setPlayerForm({...playerForm, playerName: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Full Name</label>
                  <input type="text" className="form-input" value={playerForm.fullName} onChange={e => setPlayerForm({...playerForm, fullName: e.target.value})} />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div className="form-group">
                    <label className="form-label">Age</label>
                    <input type="text" className="form-input" value={playerForm.age} onChange={e => setPlayerForm({...playerForm, age: e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Level</label>
                    <input type="number" min="1" className="form-input" value={playerForm.level} onChange={e => setPlayerForm({...playerForm, level: e.target.value})} />
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input type="email" className="form-input" value={playerForm.email} onChange={e => setPlayerForm({...playerForm, email: e.target.value})} />
                </div>
                <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }} disabled={playerSubmitting}>
                  {playerSubmitting ? 'Registering...' : 'Register Player'}
                </button>
              </form>
            </div>
          )}

          {activeTab === 'asset' && (
            <div className="glass-panel form-panel">
              <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>Create New Asset</h2>
              <p style={{ color: 'var(--text-muted)', fontSize: '13px', marginBottom: '20px' }}>
                Calls <code>POST /api/createasset</code> to save into SQL Server.
              </p>
              {assetMessage && (
                <div className={`alert ${assetMessage.type === 'success' ? 'alert-success' : 'alert-error'}`}>
                  {assetMessage.text}
                </div>
              )}
              <form onSubmit={handleCreateAsset}>
                <div className="form-group">
                  <label className="form-label">Asset Name *</label>
                  <input type="text" className="form-input" required value={assetForm.assetName} onChange={e => setAssetForm({...assetForm, assetName: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Level Requirement</label>
                  <input type="number" min="1" className="form-input" value={assetForm.levelRequire} onChange={e => setAssetForm({...assetForm, levelRequire: e.target.value})} />
                </div>
                <button type="submit" className="btn btn-emerald" style={{ width: '100%', justifyContent: 'center' }} disabled={assetSubmitting}>
                  {assetSubmitting ? 'Creating...' : 'Create Asset'}
                </button>
              </form>
            </div>
          )}

          {activeTab === 'config' && (
            <div className="glass-panel form-panel">
              <h2 style={{ fontSize: '20px', fontWeight: 700, marginBottom: '6px' }}>API Configuration</h2>
              <div className="form-group" style={{ marginTop: '20px' }}>
                <label className="form-label">API Base URL</label>
                <input type="url" className="form-input" value={apiBaseUrl} onChange={e => setApiBaseUrl(e.target.value)} />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
