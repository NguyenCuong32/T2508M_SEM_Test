<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Order</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">My Order</h1>

    <!-- Form -->
    <div class="card form-card">
      <div class="form-row">
        <div class="form-group">
          <label for="input-item">Item</label>
          <input id="input-item" class="form-input" type="text" placeholder="Item" />
        </div>
        <div class="form-group">
          <label for="input-item-name">Item Name</label>
          <input id="input-item-name" class="form-input" type="text" placeholder="Item" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-price">Price</label>
          <input id="input-price" class="form-input" type="number" placeholder="Price" min="0" />
        </div>
        <div class="form-group">
          <label for="input-quantity">Quantity</label>
          <input id="input-quantity" class="form-input" type="number" placeholder="Quantity" min="1" />
        </div>
        <div class="form-group">
          <label for="input-currency">Currency</label>
          <input id="input-currency" class="form-input" type="text" placeholder="USD" value="USD" />
        </div>
      </div>

      <div id="form-message" class="message"></div>

      <div class="form-actions">
        <button id="btn-add" class="btn-primary">Add Item to Cart</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="🔍  Search by Item Name..." />
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Item</th>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Currency</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="order-tbody"></tbody>
      </table>
    </div>
  </div>

  <script defer src="main.dart.js"></script>
</body>
</html>
