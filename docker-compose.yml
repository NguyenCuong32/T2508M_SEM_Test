services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: battlegame-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BattleGame_dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: battlegame-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  functions:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battlegame-functions
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      FUNCTIONS_EXTENSION_VERSION: "~4"
      AzureWebJobsStorage: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"
      ConnectionStrings__BattleGame: "Server=sqlserver,1433;Database=BATTLEGAME;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BattleGame_dev_2026!};TrustServerCertificate=True;Encrypt=False"
    ports:
      - "7071:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: battlegame-frontend
    ports:
      - "5173:80"
    depends_on:
      - functions

volumes:
  sqlserver-data:
  azurite-data:
