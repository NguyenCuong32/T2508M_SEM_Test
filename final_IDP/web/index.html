<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Order - Introduction to Dart Programming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-container">
    <!-- Header Title -->
    <h1 class="page-title">My Order</h1>

    <!-- Order Input Form -->
    <form id="order-form" class="order-form" novalidate>
      <!-- Row 1: Item and Item Name -->
      <div class="form-row">
        <div class="form-group" id="group-item">
          <label for="input-item">Item</label>
          <input type="text" id="input-item" placeholder="Item" required autocomplete="off">
          <span class="error-text hidden" id="err-item"></span>
        </div>
        <div class="form-group" id="group-item-name">
          <label for="input-item-name">Item Name</label>
          <input type="text" id="input-item-name" placeholder="Item" required autocomplete="off">
          <span class="error-text hidden" id="err-item-name"></span>
        </div>
      </div>

      <!-- Row 2: Price, Quantity, Currency -->
      <div class="form-row form-row-three">
        <div class="form-group" id="group-price">
          <label for="input-price">Price</label>
          <input type="text" id="input-price" placeholder="Price" inputmode="decimal" required autocomplete="off">
          <span class="error-text hidden" id="err-price"></span>
        </div>
        <div class="form-group" id="group-quantity">
          <label for="input-quantity">Quantity</label>
          <input type="text" id="input-quantity" placeholder="Quantity" inputmode="numeric" required autocomplete="off">
          <span class="error-text hidden" id="err-quantity"></span>
        </div>
        <div class="form-group" id="group-currency">
          <label for="input-currency">Currency</label>
          <input type="text" id="input-currency" value="USD" required autocomplete="off">
          <span class="error-text hidden" id="err-currency"></span>
        </div>
      </div>

      <!-- Alert / Toast Container inside form -->
      <div id="alert-box" class="alert-box hidden"></div>

      <!-- Button Row -->
      <div class="form-actions">
        <button type="submit" id="btn-add-item" class="btn-primary">Add Item to Cart</button>
        <button type="submit" id="btn-update-item" class="btn-warning hidden">Update Order</button>
        <button type="button" id="btn-cancel-edit" class="btn-cancel hidden">Cancel</button>
      </div>
    </form>

    <!-- Search Section (Allows search Order by ItemName) -->
    <div class="search-section">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="input-search" placeholder="Search Order by Item Name..." autocomplete="off">
        <button type="button" id="btn-search" class="btn-search">Search</button>
        <button type="button" id="btn-clear-search" class="btn-clear">Reset</button>
      </div>
      <div id="search-status" class="search-status"></div>
    </div>

    <!-- Orders Data Table -->
    <div class="table-container">
      <table id="orders-table" class="orders-table">
        <thead>
          <tr>
            <th class="th-id">Id</th>
            <th class="th-item">Item</th>
            <th class="th-name">Item Name</th>
            <th class="th-qty">Quantity</th>
            <th class="th-price">Price</th>
            <th class="th-currency">Currency</th>
            <th class="th-action"></th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <!-- Dynamically populated by Dart -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state hidden">
        No orders found. Add an item or reset the search filter.
      </div>
    </div>

    <!-- Action Toolbar (Extra Senior Dev utility for testing & saving) -->
    <div class="extra-toolbar">
      <button type="button" id="btn-fill-sample" class="btn-secondary" title="Điền giá trị mẫu vào form để test nhanh">
        ⚡ Auto-fill Input Form
      </button>
      <button type="button" id="btn-load-mock" class="btn-secondary" title="Load sample values A1000-A1008 from Page 1">
        📋 Load Sample Values (A1000-A1008)
      </button>
      <button type="button" id="btn-export-json" class="btn-secondary" title="Download updated order.json">
        💾 Export order.json
      </button>
      <button type="button" id="btn-reload-json" class="btn-secondary" title="Reset to original 2 items">
        🔄 Reset (2 Items)
      </button>
    </div>

    <!-- Footer Banner matching exam screenshot -->
    <footer class="footer-banner">
      Số 8, Tôn Thất Thuyết, Cầu Giấy, Hà Nội
    </footer>
  </div>

  <!-- Compiled Dart Application (Cache-busting version parameter) -->
  <script defer src="main.dart.js?v=1.3"></script>
</body>
</html>
