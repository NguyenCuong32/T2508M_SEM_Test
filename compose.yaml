services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sunrise_root_dev}
      MYSQL_DATABASE: SUNRISEHOTEL
    ports:
      - "3307:3306"
    volumes:
      - hotel_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Hotel: Server=db;Port=3306;Database=SUNRISEHOTEL;User ID=root;Password=${MYSQL_ROOT_PASSWORD:-sunrise_root_dev};
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      db:
        condition: service_healthy
volumes:
  hotel_data:
