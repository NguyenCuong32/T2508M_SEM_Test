<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Order - Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="main.dart.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div>
        <h1 class="header-title">My Order</h1>
        <p class="header-subtitle">Streamlined order and product item management</p>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <!-- Card: Add Item Form -->
      <section class="card form-card">
        <div class="card-header">
          <h2 class="card-title" id="formCardTitle">Add New Order Item</h2>
          <span class="card-subtitle" id="formCardSubtitle">Fill in details to add item into order list</span>
        </div>

        <form class="order-form" onsubmit="return false;">
          <div class="form-grid">
            <div class="form-group">
              <label for="itemInput">Item Code <span class="required">*</span></label>
              <input type="text" id="itemInput" placeholder="e.g. A1000" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label for="itemNameInput">Item Name <span class="required">*</span></label>
              <input type="text" id="itemNameInput" placeholder="e.g. iPhone 16 Pro Max" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label for="priceInput">Price <span class="required">*</span></label>
              <input type="number" id="priceInput" placeholder="e.g. 1200" step="any" min="0" required>
            </div>
            <div class="form-group">
              <label for="quantityInput">Quantity <span class="required">*</span></label>
              <input type="number" id="quantityInput" placeholder="Quantity" value="1" min="1" required>
            </div>
            <div class="form-group">
              <label for="currencyInput">Currency</label>
              <input type="text" id="currencyInput" value="USD">
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="btnCancelEdit" class="btn btn-secondary" style="display: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>Cancel</span>
            </button>
            <button type="button" id="btnAddItem" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span id="btnText">Add Item to Cart</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Card: Orders Data Table -->
      <section class="card table-card">
        <div class="card-toolbar">
          <div>
            <h2 class="card-title">Order Items</h2>
            <span class="card-subtitle">Showing all current ordered products</span>
          </div>
          
          <!-- Search Toolbar -->
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchItemInput" class="search-input" placeholder="Search by Item Name...">
          </div>
        </div>

        <div class="table-wrapper">
          <table class="order-table">
            <thead>
              <tr>
                <th style="width: 60px;">#</th>
                <th style="width: 120px;">Item Code</th>
                <th>Item Name</th>
                <th style="width: 100px; text-align: center;">Quantity</th>
                <th style="width: 130px; text-align: right;">Price</th>
                <th style="width: 100px; text-align: center;">Currency</th>
                <th style="width: 170px; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="orderTableBody">
              <!-- Rendered via Dart -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
